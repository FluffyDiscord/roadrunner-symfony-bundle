syntax = "proto3";

package bundle.test;

option php_namespace = "FluffyDiscord\\RoadRunnerBundle\\Tests\\Grpc\\Live\\Generated";
option php_metadata_namespace = "FluffyDiscord\\RoadRunnerBundle\\Tests\\Grpc\\Live\\Generated\\GPBMetadata";

service Echo {
  rpc Ping (PingRequest) returns (PingResponse);
  rpc Fail (FailRequest) returns (PingResponse);
  rpc Crash (CrashRequest) returns (PingResponse);
  rpc WhoAmI (WhoAmIRequest) returns (WhoAmIResponse);
}

message PingRequest { string message = 1; }
message PingResponse { string message = 1; int64 pid = 2; }
message FailRequest {}
message CrashRequest {}
message WhoAmIRequest {}
message WhoAmIResponse { string user = 1; }
